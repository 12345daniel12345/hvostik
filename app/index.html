<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#171310">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file:; media-src 'self' file:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Хвостик</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css?v=20261127-audit">
  <link rel="stylesheet" href="css/pet.css?v=20261127-dog">
  <script defer src="../data/cities.js?v=20261127-audit"></script>
  <script defer src="js/core.js?v=20261127-5"></script>
  <script defer src="js/phrases.js?v=20261127-5"></script>
  <script defer src="js/pet-anim.js?v=20261127-audit"></script>
  <script defer src="js/videos.js?v=20261127-5"></script>
  <script defer src="js/map.js?v=20261127-5"></script>
  <script defer src="js/app.js?v=20261127-dog"></script>
</head>
<body>
  <div class="shell">
    <header class="top">
      <span class="wordmark">Хвостик</span>
      <button class="round" id="menu-button" type="button" aria-label="Меню" aria-controls="menu" aria-expanded="false" hidden>⋯</button>
    </header>
    <aside id="menu" class="menu" aria-label="Меню приложения" hidden></aside>
    <p id="storage-notice" class="notice" role="status" hidden>Сохранение недоступно: данные пропадут при закрытии</p>
    <main id="screen" aria-labelledby="scene-title">
      <div id="scene-art"></div>
      <div id="scene-controls"></div>
    </main>
    <footer class="credits">
      <span>Проверочная версия</span>
      <span>Иллюстрация</span>
    </footer>
    <dialog id="sheet" aria-labelledby="sheet-title">
      <header class="sheet-top">
        <span class="sheet-grip" aria-hidden="true"></span>
        <button type="button" class="round sheet-close" data-action="close-sheet" aria-label="Закрыть шторку">×</button>
      </header>
      <div id="sheet-content" class="sheet-content"></div>
    </dialog>
  </div>
</body>
</html>
